<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYC Extract</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b59c3'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M11 19h6M11 15h10' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>KYC Extract</h1>
      <span id="health" class="health" title="État de l'API">…</span>
      <button id="keyBtn" class="ghost" type="button" title="Clé API">Clé API</button>
    </header>

    <form id="keyForm" class="keyform" hidden>
      <input id="keyInput" type="password" placeholder="X-API-Key" autocomplete="off">
      <button type="submit">Enregistrer</button>
    </form>

    <label id="drop" class="drop" tabindex="0">
      <input id="file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/tiff,image/bmp" hidden>
      <div class="drop-inner">
        <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <p><strong>Déposez un document</strong> ou cliquez pour choisir</p>
        <p class="muted">PDF, JPEG, PNG, WEBP · coller (Ctrl+V) fonctionne aussi</p>
      </div>
    </label>

    <div class="options">
      <label>Type
        <select id="docType">
          <option value="">Détection auto</option>
        </select>
      </label>
      <label>IA (Claude)
        <select id="llm">
          <option value="">Défaut serveur</option>
          <option value="off">Jamais</option>
          <option value="fallback">Si nécessaire</option>
          <option value="always">Toujours</option>
        </select>
      </label>
    </div>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <div class="preview" id="preview"></div>
        <div class="summary">
          <div class="row">
            <h2 id="docLabel"></h2>
            <span id="status" class="badge"></span>
          </div>
          <div id="meta" class="muted small"></div>
          <div id="timings" class="timings"></div>
        </div>
      </div>
      <ul id="warnings" class="warnings"></ul>
      <table class="fields"><tbody id="fields"></tbody></table>
      <details>
        <summary>JSON brut <button id="copy" class="ghost small" type="button">Copier</button></summary>
        <pre id="json"></pre>
      </details>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
