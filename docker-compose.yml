# Coolify: "Docker Compose" build pack, attach your domain to the `web` service only.
# The API stays private; nginx (web) proxies /api to it. It alone joins the shared `coolify`
# network to reach the kyc-db database. That network is shared with other projects, hence the
# unique service name: a plain `api` could resolve to, or be resolved by, another stack.
services:
  kyc-api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      - API_KEYS=${API_KEYS:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODE=${LLM_MODE:-fallback}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-5-5}
      - LLM_EFFORT=${LLM_EFFORT:-low}
      - LLM_CHECK_UNCERTAIN=${LLM_CHECK_UNCERTAIN:-true}
      - OCR_CONCURRENCY=${OCR_CONCURRENCY:-2}
      - OCR_FAST_MODEL=${OCR_FAST_MODEL:-tiny}
      - OCR_ACCURATE_MODEL=${OCR_ACCURATE_MODEL:-small}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-15}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    expose:
      - "8000"
    networks:
      - default
      - coolify

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      - API_UPSTREAM=kyc-api:8000
    depends_on:
      kyc-api:
        condition: service_healthy
    expose:
      - "80"

networks:
  coolify:
    external: true
